# Render Blueprint: web service + managed PostgreSQL.
# Secrets marked sync:false are entered in the Render dashboard, never committed.
services:
  - type: web
    name: oims
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app wsgi db upgrade
    startCommand: gunicorn wsgi:app --workers 3 --timeout 60 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: OIMS_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: oims-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: OIMS_SETUP_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: oims-db
    plan: basic-256mb
    databaseName: oims
    user: oims
