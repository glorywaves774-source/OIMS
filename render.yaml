# Render Blueprint: web service, hourly reminders + billing job and managed PostgreSQL.
# Values marked sync:false are entered in the Render dashboard, never committed.
# Check plan names against Render's current offer before applying.

envVarGroups:
  - name: oims-settings
    envVars:
      - key: OIMS_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: MALLOC_ARENA_MAX          # keeps memory use of the threaded web server low (measured: -15%)
        value: "2"
      - key: WEB_CONCURRENCY           # server processes; 1 suits the 512 MB starter plan (gunicorn.conf.py)
        value: "1"
      - key: REQUIRE_PLATFORM_2FA
        value: "true"
      - key: STORAGE_BACKEND
        value: local                 # "s3" for object storage; see docs/DEPLOYMENT.md
      - key: UPLOAD_ROOT
        value: /var/data/uploads     # on the persistent disk below
      - key: PUBLIC_BASE_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: PAYSTACK_SECRET_KEY       # optional: online card / mobile money payments for subscriptions
        sync: false

services:
  - type: web
    name: oims
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    preDeployCommand: flask --app wsgi db upgrade && flask --app wsgi oims sync-roles
    startCommand: gunicorn wsgi:app    # settings in gunicorn.conf.py
    healthCheckPath: /healthz
    disk:
      name: oims-files
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - fromGroup: oims-settings
      - key: DATABASE_URL
        fromDatabase:
          name: oims-db
          property: connectionString
      - key: OIMS_SETUP_TOKEN
        sync: false

  - type: cron
    name: oims-reminders
    runtime: python
    plan: starter
    schedule: "5 * * * *"          # hourly, at minute 5 (UTC)
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app wsgi oims send-reminders && flask --app wsgi oims billing-run
    envVars:
      - fromGroup: oims-settings
      - key: DATABASE_URL
        fromDatabase:
          name: oims-db
          property: connectionString

databases:
  - name: oims-db
    plan: basic-256mb
    databaseName: oims
    user: oims
