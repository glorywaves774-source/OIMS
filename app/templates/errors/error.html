{% extends "layout_auth.html" %}
{% block title %}{{ title }}{% endblock %}
{% block heading %}{{ title }}{% endblock %}
{% block content %}
<p class="text-muted mb-1">Error {{ code }}</p>
<p>{{ message }}</p>
<div class="toolbar">
  {% if current_user.is_authenticated %}<a class="btn btn-primary" href="{{ url_for('account.home') }}">Go to my home page</a>
  {% else %}<a class="btn btn-primary" href="{{ url_for('auth.login') }}">Sign in</a>{% endif %}
</div>
{% endblock %}
